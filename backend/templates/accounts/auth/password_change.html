{% extends "layouts/app.html" %}
{% block title %}Change password · {{ theme.brand_name }}{% endblock %}
{% block content %}
<div class="page-head"><h1>Change password</h1></div>
<section class="narrower card">
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "components/form.html" %}
    <div class="actions mt-4">
      <button type="submit" class="btn btn-primary" data-loading>Change password</button>
      <a class="btn" href="{% url 'accounts:profile' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
