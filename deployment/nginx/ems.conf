# Draft. TLS termination here; app sees X-Forwarded-Proto.
server {
    listen 443 ssl;
    server_name ems.example.invalid;
    client_max_body_size 12m;
    location /static/ { alias /srv/ems/backend/staticfiles/; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
