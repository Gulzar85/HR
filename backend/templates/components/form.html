{% load crispy_forms_tags %}
{% comment %}Reusable server-rendered form body. Expects `form`. Non-field + field errors are rendered accessibly.{% endcomment %}
<div class="ems-form">
  {% if form.non_field_errors %}
  <div class="alert alert-error" role="alert">
    {% for error in form.non_field_errors %}<div>{{ error }}</div>{% endfor %}
  </div>
  {% endif %}
  {{ form|crispy }}
</div>
