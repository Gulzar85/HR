[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-ems"
version = "0.1.0"
description = "McDonald's Pakistan Employee Management System (modular monolith)"
requires-python = ">=3.12"
# Every dependency has a documented reason in ../docs/architecture/dependencies.md
dependencies = [
    "Django>=6.1,<6.2",
    "djangorestframework>=3.18,<4",
    "django-environ>=0.14",
    "psycopg[binary]>=3.3",
    "redis>=8.1",
    "celery>=5.6,<6",
    "django-filter>=26.1",
    "django-htmx>=1.29",
    "django-crispy-forms>=2.7",
    "crispy-tailwind>=1.0.3",
    "django-guardian>=3.5",
    "django-csp>=4.0,<5",
    "django-import-export>=4.4",
    "whitenoise>=6.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-django>=4.14",
    "ruff>=0.16",
    "mypy>=2.4",
    "django-stubs>=6.1",
    "djangorestframework-stubs>=3.18",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --reuse-db"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM", "T20"]  # T20 forbids print()
ignore = ["DJ001", "S101", "E501", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"config/settings/*" = ["S105"]
"manage.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations", "tests"]

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*"]
