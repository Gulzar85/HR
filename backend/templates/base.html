{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false}'>
  <title>{% block title %}{{ theme.brand_name }}{% endblock %}</title>
  <link rel="icon" href="{{ theme_favicon_url }}">
  {# Semantic design tokens (--color-*) come from the Theme Engine. Never hard-code brand colours. #}
  <style nonce="{{ CSP_NONCE }}">{{ theme_css|safe }}</style>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <link rel="stylesheet" href="{% static 'css/ems.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="ems" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <a href="#main" class="skip-link">Skip to content</a>
  {% block body %}{% endblock %}
  <script src="{% static 'js/ems.js' %}" nonce="{{ CSP_NONCE }}" defer></script>
  <script src="{% static 'js/vendor/htmx.min.js' %}" nonce="{{ CSP_NONCE }}" defer></script>
  <script src="{% static 'js/vendor/lucide.min.js' %}" nonce="{{ CSP_NONCE }}" defer></script>
  <script src="{% static 'js/vendor/alpine.csp.min.js' %}" nonce="{{ CSP_NONCE }}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
